# Debug-only probe for the discreto-data volume. NOT Discreto: no secrets, no mail,
# no internet. It exists so the volume can be looked at from a debug instance
# without the storage key. Released as a prerelease so clients keep verifying
# Discreto against the latest normal release.
cvm-version: 0.14.18
cpus: 1
memory: 2048

networks:
  internal: {}

containers:
  - name: probe
    image: "ghcr.io/pistol/discreto@sha256:6763a54c10b1f1407f1f1ea7b285e30ff2319f95dc753cd3c88da43015b4b938"
    # Serves one healthz file so the instance shows as healthy; does nothing else.
    command: ["sh", "-c", "mkdir -p /tmp/www && echo ok > /tmp/www/healthz && exec python -m http.server 8000 --bind 0.0.0.0 --directory /tmp/www"]
    networks: [internal]
    persistent_volumes: ["workspace:/persist"]
    tmpfs:
      /tmp: "size=16m"
    restart: always

volumes:
  - name: workspace
    owner: "10001:10001"

shim:
  upstream-container: probe
  upstream-port: 8000
  paths:
    - /healthz
