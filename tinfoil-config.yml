# Tinfoil Container config for Discreto.
# This file goes in its own PUBLIC repo made from tinfoilsh/tinfoil-containers-template,
# because clients verify the enclave against it. The code repo and image stay private.
# Before each release: set the image digest below and check cvm-version against the template.
cvm-version: 0.14.18
cpus: 2
memory: 8192

networks:
  # Broker and agent talk to each other here. No internet.
  internal: {}
  # Agent egress: the inference router plus the hosts the Tinfoil SDK uses to verify it.
  inference:
    egress: allowlist
    allow:
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh
      - tdx-proxy.tinfoil.sh
      - tuf-repo-cdn.sigstore.dev
  # Broker egress: Gmail over IMAP (read only), and the Gmail API for approved cleanup.
  mail:
    egress: allowlist
    allow:
      - imap.gmail.com
      - oauth2.googleapis.com
      - gmail.googleapis.com

containers:
  - name: broker
    image: "ghcr.io/pistol/discreto@sha256:66ef3c3eb09cfd4aa35a223bee845b20c61563a787ad2fc6e8d22e3ab68bc8b1"
    command: ["uvicorn", "--factory", "discreto.broker.app:build_from_env", "--host", "0.0.0.0", "--port", "8000"]
    networks: [internal, mail]
    env:
      - AGENT_URL: "http://agent:8001"
      - POLICY_PATH: "/app/config/policy.yml"
      - DATA_DIR: "/data"
      - TRIAGE_INTERVAL_S: "1800"
      - ALLOWED_ORIGINS: "https://pistol.github.io"
      # Enables /mcp and OAuth for the Claude custom connector. Must be this enclave's own URL.
      - PUBLIC_URL: "https://app.discreto.containers.tinfoil.dev"
    secrets:
      - BROKER_TOKEN
      - AGENT_TOKEN
      - USER_TOKENS
      - MAIL_ACCOUNTS
      - RUNLOG_KEY
      - GOOGLE_OAUTH
    # Milestone 1: in-memory data, lost on restart. See README for the encrypted volume.
    volumes: ["data:/data"]
    # persistent_volumes: ["workspace:/data"]
    tmpfs:
      /tmp: "size=64m"
    restart: always

  - name: agent
    image: "ghcr.io/pistol/discreto@sha256:66ef3c3eb09cfd4aa35a223bee845b20c61563a787ad2fc6e8d22e3ab68bc8b1"
    command: ["uvicorn", "--factory", "discreto.agent.app:build_from_env", "--host", "0.0.0.0", "--port", "8001"]
    networks: [internal, inference]
    env:
      - BROKER_URL: "http://broker:8000"
      - MODELS_PATH: "/app/config/models.yml"
      - TINFOIL_ENCLAVE: "inference.tinfoil.sh"
      - XDG_CACHE_HOME: "/tmp/cache"
      - XDG_DATA_HOME: "/tmp/data"
    secrets:
      - AGENT_TOKEN
      - BROKER_TOKEN
      - TINFOIL_API_KEY
    tmpfs:
      /tmp: "size=128m"
    restart: always

# volumes:
#   - name: workspace
#     key-secret: DATA_VOLUME_KEY

shim:
  upstream-container: broker
  upstream-port: 8000
  paths:
    - /healthz
    - /api/*
    # MCP endpoint and OAuth for the Claude custom connector
    - /mcp
    - /oauth/*
    - /.well-known/oauth-protected-resource
    - /.well-known/oauth-protected-resource/mcp
    - /.well-known/oauth-authorization-server
    # Gmail cleanup: Google sign-in page and its callback
    - /google/*
  origins:
    - "https://pistol.github.io"
    # the OAuth sign-in page posts back to the enclave itself
    - "https://app.discreto.containers.tinfoil.dev"
