# Tinfoil Container config for Discreto, written by scripts/new_config_repo.py.
# Edit discreto-site.json (or pass flags) and re-run the script instead of editing by hand.
# Clients verify the enclave against signed releases of this file, so this repo must stay public.
cvm-version: 0.14.18
cpus: 2
memory: 8192

networks:
  # Broker and agent talk to each other here. No internet.
  internal: {}
  # Agent egress: the inference router plus the hosts the Tinfoil SDK uses to verify it.
  inference:
    egress: allowlist
    allow:
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh
      - tdx-proxy.tinfoil.sh
      - tuf-repo-cdn.sigstore.dev
  # Broker egress (Tinfoil allows one egress network per container): Gmail over IMAP
  # (read only), the Gmail API for approved cleanup, and Tinfoil's admin API, used
  # only to stop this instance after an hour without use.
  mail:
    egress: allowlist
    allow:
      - imap.gmail.com
      - oauth2.googleapis.com
      - gmail.googleapis.com
      - api.tinfoil.sh

containers:
  - name: broker
    image: "ghcr.io/pistol/discreto@sha256:18bed67a94bbf4aabec95b317cbc95a8aec3c47f2aaaba99a2edd8503070b292"
    command: ["uvicorn", "--factory", "discreto.broker.app:build_from_env", "--host", "0.0.0.0", "--port", "8000"]
    networks: [internal, mail]
    env:
      - AGENT_URL: "http://agent:8001"
      - POLICY_PATH: "/app/config/policy.yml"
      - DATA_DIR: "/data"
      # Encrypted volume, unlocked from the web app with the user's key (no key-secret, so Tinfoil never has it)
      - PERSIST_DIR: "/persist"
      - PERSIST_VOLUME: "workspace"
      - TRIAGE_INTERVAL_S: "1800"
      - ALLOWED_ORIGINS: "https://pistol.github.io"
      # Enables /mcp and OAuth for the Claude custom connector. Must be this enclave's own URL.
      - PUBLIC_URL: "https://app.discreto.containers.tinfoil.dev"
      # Stop after this many minutes without use; 0 turns it off. Needs TINFOIL_STOP_KEY.
      - IDLE_STOP_MINUTES: "60"
      - TINFOIL_CONTAINER_ID: "4b4989ce-7a75-4977-9436-010a64c701de"
    secrets:
      - BROKER_TOKEN
      - AGENT_TOKEN
      - USER_TOKENS
      - MAIL_ACCOUNTS
      - RUNLOG_KEY
      - GOOGLE_OAUTH
      - TINFOIL_STOP_KEY
    volumes: ["data:/data"]
    persistent_volumes: ["workspace:/persist"]
    tmpfs:
      /tmp: "size=64m"
    restart: always

  - name: agent
    image: "ghcr.io/pistol/discreto@sha256:18bed67a94bbf4aabec95b317cbc95a8aec3c47f2aaaba99a2edd8503070b292"
    command: ["uvicorn", "--factory", "discreto.agent.app:build_from_env", "--host", "0.0.0.0", "--port", "8001"]
    networks: [internal, inference]
    env:
      - BROKER_URL: "http://broker:8000"
      - MODELS_PATH: "/app/config/models.yml"
      - TINFOIL_ENCLAVE: "inference.tinfoil.sh"
      - XDG_CACHE_HOME: "/tmp/cache"
      - XDG_DATA_HOME: "/tmp/data"
    secrets:
      - AGENT_TOKEN
      - BROKER_TOKEN
      - TINFOIL_API_KEY
    tmpfs:
      /tmp: "size=128m"
    restart: always

# Unlocked at runtime by the user's key through the volume's control socket.
volumes:
  - name: workspace
    owner: "10001:10001"

shim:
  upstream-container: broker
  upstream-port: 8000
  paths:
    - /healthz
    - /api/*
    # MCP endpoint and OAuth for the Claude custom connector
    - /mcp
    - /oauth/*
    - /.well-known/oauth-protected-resource
    - /.well-known/oauth-protected-resource/mcp
    - /.well-known/oauth-authorization-server
    # Gmail cleanup: Google sign-in page and its callback
    - /google/*
  origins:
    - "https://pistol.github.io"
    # the OAuth sign-in page posts back to the enclave itself
    - "https://app.discreto.containers.tinfoil.dev"
